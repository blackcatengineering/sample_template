apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dynamic-webapp-db-template
  title: Dynamic Webapp with Database
  description: Creates a web application with conditional validation, database layer, and a dynamic repo picker.
spec:
  owner: architecture-team
  type: service

  # 1. FORM UI DEFINITION
  parameters:
    - title: Choose Core Language
      required:
        - language
      properties:
        language:
          title: Primary Language
          type: string
          enum: [JavaScript, TypeScript, Java]

    - title: Spring Boot Configurations
      # 💡 This dependencies block completely hides this whole page unless Java is picked
      dependencies:
        language:
          oneOf:
            - properties:
                language:
                  enum: [Java]
      required:
        - languageVersion
        - frameworkVersion
      properties:
        languageVersion:
          title: Java JDK Version
          type: string
          enum: ['17', '21']
          default: '21'
        frameworkVersion:
          title: Spring Boot Version
          type: string
          enum: ['3.3', '3.4']
          default: '3.4'

    - title: Node.js Configurations
      dependencies:
        language:
          oneOf:
            - properties:
                language:
                  enum: [JavaScript, TypeScript]
      required:
        - languageVersion
        - frameworkVersion
      properties:
        languageVersion:
          title: Node.js Runtime Version
          type: string
          enum: ['18', '20', '22']
          default: '22'
        frameworkVersion:
          title: Express Version
          type: string
          enum: ['4.21', '5.0']
          default: '4.21'

    - title: Database Layer Configuration
      required:
        - database
      properties:
        database:
          title: Select Database
          type: string
          default: PostgreSQL
          enum:
            - PostgreSQL
            - MySQL

    - title: Choose Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Destination
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # 2. ACTIONS PIPELINE
  steps:

    # STEP A: Always fetch the shared/common platform manifests
    - id: fetch-common
      name: Fetch Common Baseline Manifests
      action: fetch:template
      input:
        url: ./skeleton/common
        targetPath: .
        values:
          name: ${{ values.name }}
          owner: ${{ values.owner }}
          namespace: ${{ values.namespace }}
          database: ${{ values.database }}

    # STEP B: Only fetch and parse Java files if Java was chosen
    - id: fetch-java
      name: Fetch Java Spring Boot Skeleton
      if: ${{ values.language == 'Java' }}
      action: fetch:template
      input:
        url: ./skeleton/java
        targetPath: .
        values:
          name: ${{ values.name }}
          language: ${{ values.language }}
          languageVersion: ${{ values.languageVersion }}
          frameworkVersion: ${{ values.frameworkVersion }}
          database: ${{ values.database }}

    # STEP C: Only fetch and parse Node files if JS/TS was chosen
    - id: fetch-node
      name: Fetch Node.js Express Skeleton
      if: ${{ values.language == 'JavaScript' or values.language == 'TypeScript' }}
      action: fetch:template
      input:
        url: ./skeleton/node
        targetPath: .
        values:
          name: ${{ values.name }}
          language: ${{ values.language }}
          languageVersion: ${{ values.languageVersion }}
          frameworkVersion: ${{ values.frameworkVersion }}
          database: ${{ values.database }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl if parameters.repoUrl.repoUrl is not defined else parameters.repoUrl.repoUrl }}
        description: Generated via Backstage Software Templates.

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # 3. INTERFACE LINKS
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
