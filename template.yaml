apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dynamic-webapp-db-template
  title: Dynamic Webapp with Database
  description: Creates a web application with conditional validation, database layer, and a dynamic repo picker.
spec:
  owner: architecture-team
  type: service

  # 1. FORM UI DEFINITION
  parameters:
    - title: Webapp Configuration
      required:
        - projectMeta
      properties:
        projectMeta:
          type: object
          title: Webapp Specifications
          required:
            - language
            - framework
            - version
          properties:
            language:
              title: Programming Language
              type: string
              enum:
                - JavaScript
                - TypeScript
                - Java
            framework:
              title: Target Framework
              type: string
              enum:
                - Express
                - Spring Boot
            version:
              title: Framework/Language Version
              type: string

          # ENFORCE VALID COMBINATIONS
          allOf:
            - if:
                properties:
                  language:
                    enum: [JavaScript]
              then:
                properties:
                  framework:
                    enum: [Express]
                  version:
                    enum: ['18', '20']
                    default: '20'
            - if:
                properties:
                  language:
                    enum: [TypeScript]
              then:
                properties:
                  framework:
                    enum: [Express]
                  version:
                    enum: ['18', '20']
                    default: '20'
            - if:
                properties:
                  language:
                    enum: [Java]
              then:
                properties:
                  framework:
                    enum: [Spring Boot]
                  version:
                    enum: ['17', '21']
                    default: '21'

    - title: Database Layer Configuration
      required:
        - database
      properties:
        database:
          title: Select Database
          type: string
          default: PostgreSQL
          enum:
            - PostgreSQL
            - MySQL

    - title: Choose Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Destination
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # 2. ACTIONS PIPELINE
  steps:
    - id: fetch-base
      name: Fetch Base Template Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          # 👇 THIS CORRECTION CRITICALLY UNPACKS THE NESTED PROPERTIES FOR NUNJUCKS
          language: ${{ parameters.projectMeta.language }}
          framework: ${{ parameters.projectMeta.framework }}
          languageVersion: ${{ parameters.projectMeta.version }}
          frameworkVersion: ${{ parameters.projectMeta.version }}
          database: ${{ parameters.database }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl if parameters.repoUrl.repoUrl is not defined else parameters.repoUrl.repoUrl }}
        description: Generated via Backstage Software Templates.

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # 3. INTERFACE LINKS
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
