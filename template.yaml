apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: sample-starter-template
  title: Standard Application Starter Template
  description: A clean starter framework for scaffolding repositories.
  tags:
    - starter
    - template
spec:
  owner: guest
  type: template

  parameters:
    - title: Component Details
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Name of your new repository code.
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]
    - title: Choose a Repository Owner
      required:
        - repoOwner
      properties:
        repoOwner:
          title: Repository Owner
          type: string
          ui:field: RepoOwnerPicker
          ui:options:
            host: github.com
            excludedOwners:
              - backstage
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
    - title: Choose a Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - ${{value.repoOwner}}
            allowedRepos:
              - ${{value.name}}

  steps:
    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: This is ${{parameters.name}} bootstrapped via Backstage
        repoUrl: '://github.com/${{parameters.name}}&owner=${{parameters.owner}}'

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository Link
        url: ${{ steps['publish'].output.remoteUrl }}
