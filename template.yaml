apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: cloud-three-tier-service
  title: Cloud Three-Tier Service
  description: Create a service by selecting its web, API, data, and deployment architecture.
  tags:
    - cloud
    - kubernetes
    - vm
    - three-tier
    - service

spec:
  owner: group:platform-engineering
  type: service

  parameters:
    - title: Application
      description: Basic identity and ownership for the new service.
      required:
        - name
        - owner
        - description
      properties:
        name:
          title: Service name
          type: string
          description: Lowercase name used for the component and repository.
          pattern: '^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$'
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Team responsible for the service.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: Description
          type: string
          minLength: 10
          maxLength: 200
        visibility:
          title: Repository visibility
          type: string
          default: private
          enum:
            - private
            - public
          enumNames:
            - Private
            - Public

    - title: Web / presentation tier
      description: Choose whether the service needs a user-facing web tier.
      required:
        - webEnabled
      properties:
        webEnabled:
          title: Do you want a visual web tier?
          type: boolean
          default: true
          ui:widget: radio
      dependencies:
        webEnabled:
          oneOf:
            - properties:
                webEnabled:
                  const: false
            - properties:
                webEnabled:
                  const: true
                webTechnology:
                  title: Web technology
                  type: string
                  default: react
                  enum:
                    - react
                    - angular
                    - vue
                    - django
                    - static
                    - other
                  enumNames:
                    - React
                    - Angular
                    - Vue
                    - Django
                    - Static HTML
                    - Other
                webContainer:
                  title: Web container
                  type: string
                  default: nginx
                  enum:
                    - nginx
                    - caddy
                    - node
                    - apache
                  enumNames:
                    - nginx
                    - Caddy
                    - Node.js
                    - Apache
              required:
                - webTechnology
                - webContainer

    - title: Application / API tier
      description: Choose whether the service needs application or API processing.
      required:
        - apiEnabled
      properties:
        apiEnabled:
          title: Do you want an application/API tier?
          type: boolean
          default: true
          ui:widget: radio
      dependencies:
        apiEnabled:
          oneOf:
            - properties:
                apiEnabled:
                  const: false
            - properties:
                apiEnabled:
                  const: true
                apiTechnology:
                  title: Application/API technology
                  type: string
                  default: python-fastapi
                  enum:
                    - node-express
                    - node-fastify
                    - python-fastapi
                    - python-falcon
                    - java-springboot
                    - dotnet-aspnet
                    - go
                    - other
                  enumNames:
                    - Node.js / Express
                    - Node.js / Fastify
                    - Python / FastAPI
                    - Python / Falcon
                    - Java / Spring Boot
                    - .NET / ASP.NET Core
                    - Go
                    - Other
              required:
                - apiTechnology

    - title: Data tier
      description: Choose whether the service requires persistent data.
      required:
        - databaseEnabled
      properties:
        databaseEnabled:
          title: Do you want a database?
          type: boolean
          default: true
          ui:widget: radio
      dependencies:
        databaseEnabled:
          oneOf:
            - properties:
                databaseEnabled:
                  const: false
            - properties:
                databaseEnabled:
                  const: true
                databaseTechnology:
                  title: Database technology
                  type: string
                  default: postgresql
                  enum:
                    - postgresql
                    - mysql
                    - mariadb
                    - oracle
                    - sqlserver
                    - mongodb
                    - cassandra
                    - other
                  enumNames:
                    - PostgreSQL
                    - MySQL
                    - MariaDB
                    - Oracle
                    - Microsoft SQL Server
                    - MongoDB
                    - Cassandra
                    - Other
                databaseHosting:
                  title: Database hosting
                  type: string
                  default: managed
                  enum:
                    - managed
                    - kubernetes
                    - vm
                    - external
                  enumNames:
                    - Managed cloud service
                    - Kubernetes
                    - Virtual machine
                    - External service
              required:
                - databaseTechnology
                - databaseHosting

    - title: Deployment
      description: Select the primary runtime platform.
      required:
        - deploymentTarget
        - cloudProvider
      properties:
        deploymentTarget:
          title: Deployment target
          type: string
          default: kubernetes
          enum:
            - kubernetes
            - vm
          enumNames:
            - Kubernetes
            - Virtual machines
        cloudProvider:
          title: Cloud provider
          type: string
          default: aws
          enum:
            - aws
            - azure
            - gcp
            - other
          enumNames:
            - AWS
            - Azure
            - Google Cloud
            - Other

    - title: Repository
      description: Where Backstage should publish the generated service.
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          description: GitHub repository where the generated service will be published.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - read:org

  steps:
    - id: fetchSkeleton
      name: Generate service
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          visibility: ${{ parameters.visibility }}
          webEnabled: ${{ parameters.webEnabled }}
          webTechnology: ${{ parameters.webTechnology }}
          webContainer: ${{ parameters.webContainer }}
          apiEnabled: ${{ parameters.apiEnabled }}
          apiTechnology: ${{ parameters.apiTechnology }}
          databaseEnabled: ${{ parameters.databaseEnabled }}
          databaseTechnology: ${{ parameters.databaseTechnology }}
          databaseHosting: ${{ parameters.databaseHosting }}
          deploymentTarget: ${{ parameters.deploymentTarget }}
          cloudProvider: ${{ parameters.cloudProvider }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        repoVisibility: ${{ parameters.visibility }}
        defaultBranch: main

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}