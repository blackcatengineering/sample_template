apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dynamic-github-template
  title: Dynamic GitHub Repository Template
  description: A template showing how to use the RepoUrlPicker with a dynamic organization/owner dropdown.
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Destination
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            # 👇 Triggers the frontend to fetch the user's GitHub identities dynamically
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - read:org

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./template
        values:
          repoName: ${{ parameters.repoUrl | parseRepoUrl | BillOfMaterials }} # placeholder evaluation

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts:
          - github.com
        repoUrl: ${{ parameters.repoUrl }}
        # 👇 Uses the dynamic OAuth token captured from the picker to perform the action
        token: ${{ secrets.USER_OAUTH_TOKEN }}

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoUrl: ${{ parameters.repoUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}