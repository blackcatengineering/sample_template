apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dynamic-webapp-db-template
  title: Dynamic Webapp with Database
  description: Creates a web application with conditional validation, database layer, and a dynamic repo picker.
spec:
  owner: architecture-team
  type: service

  # 1. FORM UI DEFINITION
  parameters:
    - title: Define Stack Specifications
      required:
        - language
      properties:
        language:
          title: Primary Language Stack
          type: string
          enum: 
            - 'Node.js-Express'
            - 'Java-SpringBoot'
      # 💡 Consolidating dynamic schema choices here prevents multi-page validation faults
      dependencies:
        language:
          oneOf:
            # 🟢 Configurations revealed when 'Java-SpringBoot' is chosen
            - properties:
                language:
                  enum: ['Java-SpringBoot']
              required:
                - javaVersion
                - springVersion
              properties:
                javaVersion:
                  title: Java JDK Version
                  type: string
                  enum: ['17', '21']
                  default: '21'
                springVersion:
                  title: Spring Boot Version
                  type: string
                  enum: ['3.3', '3.4']
                  default: '3.4'
            
            # 🔵 Configurations revealed when 'Node.js-Express' is chosen
            - properties:
                language:
                  enum: ['Node.js-Express']
              required:
                - nodeVersion
                - expressVersion
              properties:
                nodeVersion:
                  title: Node.js Runtime Version
                  type: string
                  enum: ['18', '20', '22']
                  default: '22'
                expressVersion:
                  title: Express Version
                  type: string
                  enum: ['4.21', '5.0']
                  default: '4.21'

    - title: Database Layer Configuration
      required:
        - database
      properties:
        database:
          title: Select Database
          type: string
          default: PostgreSQL
          enum:
            - PostgreSQL
            - MySQL

    - title: Choose Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Destination
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # 2. ACTIONS PIPELINE
  steps:

    # STEP A: Always fetch the shared/common platform manifests
    - id: fetch-common
      name: Fetch Common Baseline Manifests
      action: fetch:template
      input:
        url: ./skeleton/common
        targetPath: .
        values:
          name: ${{ values.name }}
          owner: ${{ values.owner }}
          namespace: ${{ values.namespace }}
          database: ${{ values.database }}

    # STEP B: Only fetch and parse Java files if Java was chosen
    - id: fetch-java
      name: Fetch Java Spring Boot Skeleton
      if: ${{ values.language == 'Java-SpringBoot' }}
      action: fetch:template
      input:
        url: ./skeleton/java
        targetPath: .
        values:
          name: ${{ values.name }}
          language: ${{ values.language }}
          languageVersion: ${{ values.javaVersion }}
          frameworkVersion: ${{ values.springVersion }}
          database: ${{ values.database }}

    # STEP C: Only fetch and parse Node files if JS/TS was chosen
    - id: fetch-node
      name: Fetch Node.js Express Skeleton
      if: ${{ values.language == 'Node.js-Express' }}
      action: fetch:template
      input:
        url: ./skeleton/node
        targetPath: .
        values:
          name: ${{ values.name }}
          language: ${{ values.language }}
          languageVersion: ${{ values.nodeVersion }}
          frameworkVersion: ${{ values.expressVersion }}
          database: ${{ values.database }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl if parameters.repoUrl.repoUrl is not defined else parameters.repoUrl.repoUrl }}
        description: Generated via Backstage Software Templates.

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  # 3. INTERFACE LINKS
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
