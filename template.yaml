apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dynamic-webapp-db-template
  title: Dynamic Webapp with Database
  description: Creates a web application with a dynamic GitHub publisher and a customizable database layer.
spec:
  owner: architecture-team
  type: service

  # 1. FORM STEPS DEFINITION
  parameters:
    - title: Webapp Configuration
      required:
        - projectMeta
      properties:
        projectMeta:
          type: object
          title: Webapp Specifications
          required:
            - language
            - framework
            - version
          properties:
            language:
              title: Programming Language
              type: string
              enum:
                - JavaScript
                - TypeScript
                - Java
            framework:
              title: Target Framework
              type: string
              enum:
                - Express
                - Spring Boot
            version:
              title: Framework Version
              type: string

          # ⛓️ DEPENDENCY MATRIX (Enforces valid combinations)
          allOf:
            # --- Rule 1: If JavaScript is selected ---
            - if:
                properties:
                  language:
                    enum: [JavaScript]
              then:
                properties:
                  framework:
                    enum: [Express]
                  version:
                    enum: ['4.18', '4.20']
                    default: '4.20'

            # --- Rule 2: If TypeScript is selected ---
            - if:
                properties:
                  language:
                    enum: [TypeScript]
              then:
                properties:
                  framework:
                    enum: [Express]
                  version:
                    enum: ['4.18', '4.20']
                    default: '4.20'

            # --- Rule 3: If Java is selected ---
            - if:
                properties:
                  language:
                    enum: [Java]
              then:
                properties:
                  framework:
                    enum: [Spring Boot]
                  version:
                    enum: ['3.2', '3.3']
                    default: '3.3'


    - title: Database Layer Configuration
      required:
        - database
      properties:
        database:
          title: Select Database
          type: string
          default: PostgreSQL
          enum:
            - PostgreSQL
            - MySQL
          description: Choose your target database engine.

    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Destination
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            # 👇 Triggers the frontend to fetch the user's GitHub identities dynamically
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - read:org

  # 2. BACKEND ACTIONS PIPELINE
  steps:
    - id: fetch-base
      name: Fetch Base Template Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          # 👇 Bridge the new multi-step nested object variables to the skeleton
          language: ${{ parameters.projectMeta.language }}
          framework: ${{ parameters.projectMeta.framework }}
          
          # Force both languageVersion and frameworkVersion to parse the same parameter safely
          languageVersion: ${{ parameters.projectMeta.version }}
          frameworkVersion: ${{ parameters.projectMeta.version }}
          
          database: ${{ parameters.database }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        # repoUrl: ${{ parameters.repoUrl.repoUrl }}
        description: Generated via Backstage Software Templates.
        repoUrl: ${{ parameters.repoUrl if parameters.repoUrl.repoUrl is not defined else parameters.repoUrl.repoUrl }}

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        # 👇 Update this line to use the exact same fallback evaluation
        repoUrl: ${{ parameters.repoUrl if parameters.repoUrl.repoUrl is not defined else parameters.repoUrl.repoUrl }}
        catalogInfoPath: /catalog-info.yaml

  # 3. FINAL SUMMARY OUTPUTS
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
