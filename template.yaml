apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: sample-starter-template-v2
  title: Standard Application Starter Template
  description: A clean starter framework for scaffolding repositories.
  tags:
    - starter
    - template
spec:
  owner: guest
  type: template

  # ----------------------------------------------------
  # 1. PARAMETERS WIZARD INTERFACE
  # ----------------------------------------------------
  parameters:
    - title: Step 1 - Define Stack Specifications
      required:
        - language
      properties:
        language:
          title: Primary Language Stack
          type: string
          enum: 
            - 'Node.js-Express'
            - 'Java-SpringBoot'
      dependencies:
        language:
          oneOf:
            # 🟢 JAVA ACTIVE CONDITIONAL BLOCK
            - properties:
                language:
                  enum: ['Java-SpringBoot']
                javaVersion:
                  title: Java JDK Version
                  type: string
                  enum: ['17', '21']
                  default: '21'
                springVersion:
                  title: Spring Boot Version
                  type: string
                  enum: ['3.3', '3.4']
                  default: '3.4'
              required:
                - javaVersion
                - springVersion
            
            # 🔵 NODE ACTIVE CONDITIONAL BLOCK
            - properties:
                language:
                  enum: ['Node.js-Express']
                nodeVersion:
                  title: Node.js Runtime Version
                  type: string
                  enum: ['18', '20', '22']
                  default: '22'
                expressVersion:
                  title: Express Version
                  type: string
                  enum: ['4.21', '5.0']
                  default: '4.21'
              required:
                - nodeVersion
                - expressVersion

    - title: Step 2 - Deployment Target Destination
      required:
        - name
        - owner
        - namespace
        - database
      properties:
        name:
          title: Application Name
          type: string
        owner:
          title: Owner Group
          type: string
          default: engineering-team
        namespace:
          title: Kubernetes Namespace
          type: string
          default: default
        database:
          title: Backend Database Engine
          type: string
          enum: ['PostgreSQL', 'MySQL']
          default: 'PostgreSQL'

    - title: Repository Location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Destination
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            # 👇 Triggers the frontend to fetch the user's GitHub identities dynamically
            requestUserCredentials:
              secretsKey: USER_OAUTH_TOKEN
              additionalScopes:
                github:
                  - repo
                  - read:org

# ----------------------------------------------------
  # 2. ACTIONS PIPELINE
  # ----------------------------------------------------
  steps:
    # STEP A: Always pull the common base files
    - id: fetch-common
      name: Fetch Common Baseline Manifests
      action: fetch:template
      input:
        url: ./skeleton/common
        targetPath: .
        values:
          name: "${{ values.name }}"
          owner: "${{ values.owner }}"
          namespace: "${{ values.namespace }}"
          database: "${{ values.database }}"

    # STEP B: Fetch Java only if selected AND variables are active
    - id: fetch-java
      name: Fetch Java Spring Boot Skeleton
      # 💡 Explicitly ensures Java was picked AND Java variables are present
      if: values.language == 'Java-SpringBoot' && values.javaVersion != null
      action: fetch:template
      input:
        url: ./skeleton/java
        targetPath: .
        values:
          name: "${{ values.name }}"
          language: "${{ values.language }}"
          languageVersion: "${{ values.javaVersion }}"
          frameworkVersion: "${{ values.springVersion }}"
          database: "${{ values.database }}"

    # STEP C: Fetch Node only if selected AND variables are active
    - id: fetch-node
      name: Fetch Node.js Express Skeleton
      # 💡 Explicitly ensures Node was picked AND Node variables are present
      if: values.language == 'Node.js-Express' && values.nodeVersion != null
      action: fetch:template
      input:
        url: ./skeleton/node
        targetPath: .
        values:
          name: "${{ values.name }}"
          language: "${{ values.language }}"
          languageVersion: "${{ values.nodeVersion }}"
          frameworkVersion: "${{ values.expressVersion }}"
          database: "${{ values.database }}"

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: Generated via Backstage Software Templates.


    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: "${{ steps['publish'].output.repoContentsUrl }}"
        catalogInfoPath: 'catalog-info.yaml'

  output:
    links:
      - title: Repository Link
        url: "${{ steps['publish'].output.remoteUrl }}"
