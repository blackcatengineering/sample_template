apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: sample-starter-template
  title: Standard Application Starter Template
  description: A clean starter framework for scaffolding repositories.
  tags:
    - starter
    - template
spec:
  owner: guest
  type: template

  parameters:
    - title: Component Details
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Name of your new repository code.
        owner:
          title: Owner
          type: string
          description: The team in charge.
          default: platform-team

  steps:
    - id: fetch-base
      name: Fetch Base Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ values.name }}
          owner: ${{ values.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: This is ${{ values.name }} bootstrapped via Backstage
        repoUrl: '://github.com/{{ values.name }}&owner=${{ values.owner }}'

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository Link
        url: ${{ steps['publish'].output.remoteUrl }}
