apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: sample-starter-template
  title: Standard Application Starter Template
  description: A clean starter framework for scaffolding repositories.
  tags:
    - starter
    - template
spec:
  owner: guest
  type: template

  parameters:
    # ----------------------------------------------------
    # STAGE 1: DYNAMIC SCHEMA AND CONDITIONAL INGESTION
    # ----------------------------------------------------
    - title: Step 1 - Define Stack Specifications
      required:
        - language
      properties:
        language:
          title: Primary Language Stack
          type: string
          enum: 
            - 'Node.js-Express'
            - 'Java-SpringBoot'
      dependencies:
        language:
          oneOf:
            # 🟢 JAVA ACTIVE CONDITIONAL BLOCK
            - properties:
                language:
                  enum: ['Java-SpringBoot']
              required:
                - javaVersion
                - springVersion
              properties:
                javaVersion:
                  title: Java JDK Version
                  type: string
                  enum: ['17', '21']
                  default: '21' # 💡 Default is only active if Java is selected
                springVersion:
                  title: Spring Boot Version
                  type: string
                  enum: ['3.3', '3.4']
                  default: '3.4' # 💡 Default is only active if Java is selected
            
            # 🔵 NODE ACTIVE CONDITIONAL BLOCK
            - properties:
                language:
                  enum: ['Node.js-Express']
              required:
                - nodeVersion
                - expressVersion
              properties:
                nodeVersion:
                  title: Node.js Runtime Version
                  type: string
                  enum: ['18', '20', '22']
                  default: '22' # 💡 Default is only active if Node is selected
                expressVersion:
                  title: Express Version
                  type: string
                  enum: ['4.21', '5.0']
                  default: '4.21' # 💡 Default is only active if Node is selected

    # ----------------------------------------------------
    # STAGE 2: INFRASTRUCTURE & TARGET METADATA
    # ----------------------------------------------------
    - title: Step 2 - Deployment Target Destination
      required:
        - name
        - owner
        - namespace
        - database
      properties:
        name:
          title: Application Name
          type: string
        owner:
          title: Owner Group
          type: string
          default: engineering-team
        namespace:
          title: Kubernetes Namespace
          type: string
          default: default
        database:
          title: Backend Database Engine
          type: string
          enum: ['PostgreSQL', 'MySQL']
          default: 'PostgreSQL'

  # ----------------------------------------------------
  # 2. ACTIONS PIPELINE
  # ----------------------------------------------------
  steps:
    - id: fetch-common
      name: Fetch Common Baseline Manifests
      action: fetch:template
      input:
        url: ./skeleton/common
        targetPath: .
        values:
          name: "${{ values.name }}"
          owner: "${{ values.owner }}"
          namespace: "${{ values.namespace }}"
          database: "${{ values.database }}"

    - id: fetch-java
      name: Fetch Java Spring Boot Skeleton
      if: "${{ values.language == 'Java-SpringBoot' }}"
      action: fetch:template
      input:
        url: ./skeleton/java
        targetPath: .
        values:
          name: "${{ values.name }}"
          language: "${{ values.language }}"
          languageVersion: "${{ values.javaVersion }}"
          frameworkVersion: "${{ values.springVersion }}"
          database: "${{ values.database }}"

    - id: fetch-node
      name: Fetch Node.js Express Skeleton
      if: "${{ values.language == 'Node.js-Express' }}"
      action: fetch:template
      input:
        url: ./skeleton/node
        targetPath: .
        values:
          name: "${{ values.name }}"
          language: "${{ values.language }}"
          languageVersion: "${{ values.nodeVersion }}"
          frameworkVersion: "${{ values.expressVersion }}"
          database: "${{ values.database }}"

    - id: publish
      name: Publish to Git Repository
      action: publish:github
      input:
        description: "This is ${{ values.name }} bootstrapped via Backstage"
        repoUrl: "://github.com{{ values.name }}&owner=${{ values.owner }}"

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: "${{ steps['publish'].output.repoContentsUrl }}"
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository Link
        url: "${{ steps['publish'].output.remoteUrl }}"
