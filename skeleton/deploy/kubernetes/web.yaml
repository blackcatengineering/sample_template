# Web tier: ${{ values.webTechnology | default('none') }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.name }}-web
  namespace: ${{ values.name }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${{ values.name }}-web
  template:
    metadata:
      labels:
        app: ${{ values.name }}-web
    spec:
      containers:
        - name: web
          image: ${{ values.name }}-web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}-web
  namespace: ${{ values.name }}
spec:
  selector:
    app: ${{ values.name }}-web
  ports:
    - port: 80
      targetPort: 8080
