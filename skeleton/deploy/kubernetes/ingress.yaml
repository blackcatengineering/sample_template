# Configure TLS, DNS and the ingress controller for the target cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.name }}
spec:
  rules:
    - host: ${{ values.name }}.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${{ values.name }}-web
                port:
                  number: 80
