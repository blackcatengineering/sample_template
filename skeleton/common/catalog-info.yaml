apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  # Using the dump filter handles names safely even if special characters leak in
  name: {{ values.name | dump }}
  description: "Scaffolded application using the {{ values.language }} stack"
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: experimental
  owner: {{ values.owner | default("engineering-team") | dump }}